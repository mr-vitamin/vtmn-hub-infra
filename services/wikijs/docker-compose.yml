services:
  db:
    image: postgres:15
    container_name: wiki-db
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.0.25:514"
        tag: "{{.Name}}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WIKIJS_DB_PASSWORD:?WIKIJS_DB_PASSWORD must be set and nonempty}
    volumes:
      - /opt/wiki/db:/var/lib/postgresql/data

  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.0.25:514"
        tag: "{{.Name}}"
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wiki
      DB_PASS: ${WIKIJS_DB_PASSWORD:?WIKIJS_DB_PASSWORD must be set and nonempty}
      DB_NAME: wiki
